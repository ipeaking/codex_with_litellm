services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-course-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_course}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_course}
      POSTGRES_DB: ${POSTGRES_DB:-ai_course}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_course} -d ${POSTGRES_DB:-ai_course}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-course-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: ai-course-litellm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_course}:${POSTGRES_PASSWORD:-ai_course}@postgres:5432/${POSTGRES_DB:-ai_course}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LITELLM_LOG: INFO
    command:
      - "--config"
      - "/app/config.yaml"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)\nPY"
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
